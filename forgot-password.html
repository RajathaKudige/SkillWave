<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Request a password reset link for your SkillWave account.">
  <title>Reset Your Password | SkillWave</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body class="login-page" data-account-page="forgot-password">
  <header class="login-header">
    <div class="container login-header-inner"><a class="brand" href="index.html"><span>SkillWave</span></a></div>
  </header>
  <main class="login-main">
    <section class="login-layout" aria-labelledby="account-title">
      <div class="login-intro">
        <p class="eyebrow">SKILLWAVE / ACCOUNT ACCESS</p>
        <h1 id="account-title">Reset your password</h1>
        <p>Enter the email associated with your SkillWave account and we'll send you a password reset link.</p>
      </div>
      <div class="login-panel">
        <p class="login-form-label">Password recovery</p>
        <div id="form-message" class="form-message" role="status" aria-live="polite" tabindex="-1"></div>
        <form id="forgot-password-form" novalidate>
          <div class="form-field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
          </div>
          <button class="button form-submit" type="submit">Send reset link</button>
        </form>
        <p class="account-switch"><a href="login.html">Back to login</a></p>
      </div>
    </section>
  </main>
  <footer class="login-footer">© 2026 SkillWave · Professional Development Ecosystem</footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/account.js"></script>
  <script src="js/password-recovery.js"></script>
</body>
</html>
