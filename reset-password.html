<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create a new password for your SkillWave account.">
  <title>Create a New Password | SkillWave</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body class="login-page" data-account-page="reset-password">
  <header class="login-header">
    <div class="container login-header-inner"><a class="brand" href="index.html"><span>SkillWave</span></a></div>
  </header>
  <main class="login-main">
    <section class="login-layout" aria-labelledby="account-title">
      <div class="login-intro">
        <p class="eyebrow">SKILLWAVE / ACCOUNT ACCESS</p>
        <h1 id="account-title">Create a new password</h1>
        <p>Choose a new password for your SkillWave account. Use at least 8 characters.</p>
      </div>
      <div class="login-panel">
        <p class="login-form-label">Update your password</p>
        <div id="form-message" class="form-message" role="status" aria-live="polite" tabindex="-1"></div>
        <form id="reset-password-form" novalidate hidden>
          <div class="form-field">
            <label for="new-password">New password</label>
            <input id="new-password" name="password" type="password" autocomplete="new-password" minlength="8" required aria-describedby="password-guidance">
            <small class="signup-field-note" id="password-guidance">Use at least 8 characters.</small>
          </div>
          <div class="form-field">
            <label for="confirm-password">Confirm new password</label>
            <input id="confirm-password" name="passwordConfirmation" type="password" autocomplete="new-password" minlength="8" required>
          </div>
          <button class="button form-submit" type="submit">Update password</button>
        </form>
        <p class="account-switch" id="reset-login-link" hidden><a href="login.html">Back to login</a></p>
      </div>
    </section>
  </main>
  <footer class="login-footer">© 2026 SkillWave · Professional Development Ecosystem</footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/account.js"></script>
  <script src="js/password-recovery.js"></script>
</body>
</html>
