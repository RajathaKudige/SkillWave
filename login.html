<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Log in to your SkillWave account.">
  <title>Log In | SkillWave</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body class="login-page" data-account-page="login">
  <header class="login-header">
    <div class="container login-header-inner">
      <a class="brand" href="index.html"><span>SkillWave</span></a>
    </div>
  </header>
  <main class="login-main">
    <section class="login-layout" aria-labelledby="account-title">
      <div class="login-intro">
        <p class="eyebrow">SKILLWAVE / MEMBER ACCESS</p>
        <h1 id="account-title">Welcome back.</h1>
        <p>Your profile and next priorities are ready. Log in to pick up where you left off.</p>
      </div>
      <div class="login-panel">
        <p class="login-form-label">Log in to SkillWave</p>
        <div id="form-message" class="form-message" role="alert" aria-live="polite"></div>
        <form id="account-form" data-mode="login" novalidate>
          <div class="form-field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
          </div>
          <div class="form-field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
          </div>
          <button class="button form-submit" type="submit">Log In</button>
        </form>
        <p class="account-switch">New to SkillWave? <a href="signup.html">Create an account</a></p>
      </div>
    </section>
  </main>
  <footer class="login-footer">© 2026 SkillWave · Professional Development Ecosystem</footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/account.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
