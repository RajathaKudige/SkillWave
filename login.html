<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Log in to your Professional Level account.">
  <title>Log In | Professional Level</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="onboarding-page" data-account-page="login">
  <header class="onboarding-header"><div class="container onboarding-nav"><a class="brand" href="index.html"><span class="brand-mark">PL</span><span>Professional Level</span></a></div></header>
  <main class="onboarding-main"><section class="onboarding-card account-card" aria-labelledby="account-title">
    <div class="onboarding-intro"><p class="eyebrow">WELCOME BACK</p><h1 id="account-title">Log In</h1><p>Continue your career journey.</p></div>
    <div id="form-message" class="form-message" role="alert" aria-live="polite"></div>
    <form id="account-form" data-mode="login" novalidate>
      <div class="form-field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div>
      <div class="form-field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
      <button class="button form-submit" type="submit">Log In</button>
    </form>
    <p class="account-switch">New here? <a href="signup.html">Create an account</a></p>
  </section></main>
  <footer class="onboarding-footer">© 2026 Professional Level Ecosystem for Students</footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script><script src="js/account.js"></script><script src="js/auth.js"></script>
</body>
</html>
